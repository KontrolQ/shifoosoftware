{{> adminshell}}
<div class="crumbs"><a href="{{backHref}}">{{backLabel}}</a> &rsaquo; reorder</div>

<div class="bar">{{heading}}</div>
<form method="post" action="{{root}}/reorder/{{what}}/{{owner}}">
  <ol class="reorder">
  {{#rows}}
    <li>
      <input type="hidden" name="handle" value="{{handle}}">
      <span class="grip">{{name}}</span>
      <button type="button" data-move="up" title="Move up">&#9650;</button>
      <button type="button" data-move="down" title="Move down">&#9660;</button>
    </li>
  {{/rows}}
  </ol>
  <div class="search-row">
    <button type="submit">Save Order</button>
    <a class="clear" href="{{backHref}}">Cancel</a>
  </div>
</form>
<p class="pagedesc">Move rows with the arrows, then save. The order numbers are worked out for you.</p>
{{> adminfoot}}
