<label class="measurefield">{{label}}
  <span class="parts">
    <input name="{{name}}_size" value="{{size}}" inputmode="numeric" placeholder="0">
    <select name="{{name}}_unit">{{#units}}<option value="{{value}}"{{#chosen}} selected{{/chosen}}>{{value}}</option>{{/units}}</select>
  </span>
</label>
