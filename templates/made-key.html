{{> adminshell}}
<div class="crumbs"><a href="{{root}}/keys">Keys</a> &rsaquo; created</div>

<div class="bar">{{heading}} <small>{{subheading}}</small></div>

<div class="answer">{{secret}}</div>
<p class="pagedesc">The key is kept, so it can be read again from its own page.</p>

<dl class="facts">
  <dt>Acts as</dt><dd>{{actingAs}}</dd>
  <dt>Role</dt><dd>{{roleName}}</dd>
  <dt>Sent as</dt><dd class="key">Authorization: Bearer &lt;the key above&gt;</dd>
</dl>

<div class="search-row">
  <a class="clear" href="{{keyHref}}">Done</a>
</div>
