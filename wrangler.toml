name = "shifoosoftware"
main = "src/index.js"
compatibility_date = "2026-08-01"

# the libsql client reaches for node:diagnostics_channel
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[[routes]]
pattern = "software.shi.foo"
custom_domain = true

[assets]
directory = "./public"
binding = "ASSETS"

[[rules]]
type = "Text"
globs = ["templates/**/*.html"]
fallthrough = true
