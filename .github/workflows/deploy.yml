name: Deploy

# Every push to main goes live. Nothing else deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing the one before it.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Everything published is minified: the templates, the stylesheets and the
      # scripts here, and the worker bundle itself by wrangler.
      - name: Minify into build/
        run: npm run build

      # The schema goes first, so the worker never meets a database it predates.
      - name: Bring the database up to date
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply shifoosoftware --remote

      - name: Publish the worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --cwd build --minify

      - name: Give it its secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            ADMIN_PATH
            OIDC_DISCOVERY
            OIDC_CLIENT_ID
            OIDC_CLIENT_SECRET
            OIDC_REDIRECT
            S3_ENDPOINT
            S3_PUBLIC_BASE
            S3_REGION
            S3_ACCESS_KEY_ID
            S3_SECRET_ACCESS_KEY
            S3_BUCKET_NAME
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          OIDC_DISCOVERY: ${{ secrets.OIDC_DISCOVERY }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          OIDC_REDIRECT: ${{ secrets.OIDC_REDIRECT }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
