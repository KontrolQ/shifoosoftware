name: Check

# Proves the worker still builds. Needs no credentials, so it runs on anything.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Bundle without publishing
        run: npx wrangler deploy --dry-run --outdir dist
